name: ci

on:
  push:
    branches: [main]
    paths: ["aggregator/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["aggregator/**", ".github/workflows/ci.yml"]

jobs:
  aggregator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aggregator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
