# Minimal Mosquitto config for the on-site Mac aggregator (v1 viability test).
#
#   brew install mosquitto
#   mosquitto -c infra/mosquitto/mosquitto.conf
#
# v1 testing uses username/password auth — REQUIRED on shared/store WiFi. TLS is
# a documented follow-up (docs/ARCHITECTURE.md §1). To enable auth:
#   1. set `allow_anonymous false` below
#   2. mosquitto_passwd -c /usr/local/etc/mosquitto/passwd uknomi
#   3. point `password_file` at it

listener 1883 0.0.0.0
persistence true
persistence_location ./.mosquitto/

# --- Auth (uncomment for anything beyond a localhost smoke test) ---
allow_anonymous true
# allow_anonymous false
# password_file /usr/local/etc/mosquitto/passwd

# Segment payloads are small (one utterance); keep a sane ceiling.
message_size_limit 10485760
