[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uknomi-aggregator"
version = "0.1.0"
description = "uKnomi Edge POS Audio — Mac aggregator: MQTT ingest, whisper, consolidation, LLM order-split, S3"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "paho-mqtt>=2.0",
    "anthropic>=0.40",
    "boto3>=1.34",
]

[project.optional-dependencies]
# Transcription backend. faster-whisper is the zero-compile default; install with
#   pip install -e '.[whisper]'
# (whisper.cpp is supported via config without this extra — see transcribe.py).
whisper = ["faster-whisper>=1.0"]
# Test/replay tooling (fake_feeder needs soundfile+numpy to read WAVs).
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.scripts]
uknomi-aggregator = "uknomi_aggregator.app:main"

[tool.hatch.build.targets.wheel]
packages = ["uknomi_aggregator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
